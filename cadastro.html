<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastro | Cidade Alta RP</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111;
}

header{
    background:#111;
    color:#fff;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:6px 0 0;
    color:#bbb;
    font-size:14px;
}

.container{
    width:100%;
    max-width:550px;
    margin:auto;
    padding:25px 18px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
}

p{
    color:#555;
    line-height:1.5;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:18px;
    letter-spacing:2px;
    margin:8px 0 12px;
    text-align:center;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#111;
    color:#fff;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.resultado{
    margin-top:18px;
    padding:18px;
    border-radius:10px;
    display:none;
    text-align:center;
}

.disponivel{
    background:#e8f7ed;
    color:#16843c;
}

.utilizado{
    background:#fdeaea;
    color:#c62828;
}

.erro{
    background:#fff0f0;
    color:#c62828;
}

.codigo{
    display:block;
    font-size:30px;
    font-weight:bold;
    letter-spacing:4px;
    margin:10px 0;
}

.voltar{
    margin-top:12px;
    background:#e5e5e5;
    color:#111;
}

.info{
    background:#f5f5f5;
    border-radius:10px;
    padding:14px;
    margin-top:18px;
    font-size:13px;
}
</style>
</head>

<body>

<header>

    <h1>CIDADE ALTA RP</h1>

    <p>Consulta de Eleitor</p>

</header>


<div class="container">

    <div class="card">

        <h2>
            Consultar código
        </h2>

        <p>
            Digite o código de 6 dígitos recebido
            para consultar a situação do eleitor.
        </p>


        <input
            id="codigo"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
            autocomplete="off"
            oninput="limitarCodigo(this)"
        >


        <button onclick="consultar()">
            CONSULTAR
        </button>


        <div
            id="resultado"
            class="resultado"
        ></div>


        <div class="info">

            Os códigos são gerados automaticamente
            pelo sistema. Não é necessário cadastrar
            o nome do eleitor.

        </div>


        <button
            class="voltar"
            onclick="voltar()"
        >
            VOLTAR

        </button>

    </div>

</div>


<script>

const CHAVE="eleitoresCidadeAlta";


/* =========================
LIMITE DO CÓDIGO
========================= */

function limitarCodigo(input){

    input.value=
        input.value
            .replace(/\D/g,"")
            .slice(0,6);

}


/* =========================
CARREGAR ELEITORES
========================= */

function lerEleitores(){

    try{

        const dados=
            JSON.parse(
                localStorage.getItem(
                    CHAVE
                )
            );


        if(
            Array.isArray(dados)
        ){

            return dados;

        }

    }catch(e){}


    return [];

}


/* =========================
CONSULTAR
========================= */

function consultar(){

    const codigo=
        document
            .getElementById("codigo")
            .value
            .trim();


    const resultado=
        document.getElementById(
            "resultado"
        );


    resultado.style.display=
        "block";


    if(codigo.length!==6){

        resultado.className=
            "resultado erro";


        resultado.innerHTML=
            "Digite um código válido de 6 dígitos.";

        return;

    }


    const eleitores=
        lerEleitores();


    const eleitor=
        eleitores.find(
            item=>
                String(item.id)===codigo
        );


    if(!eleitor){

        resultado.className=
            "resultado erro";


        resultado.innerHTML=
            "Código não encontrado.";

        return;

    }


    if(eleitor.votou){

        resultado.className=
            "resultado utilizado";


        resultado.innerHTML=
            `
            <strong>CÓDIGO UTILIZADO</strong>
            <span class="codigo">${codigo}</span>
            Este código já foi utilizado para votar.
            `;

        return;

    }


    resultado.className=
        "resultado disponivel";


    resultado.innerHTML=
        `
        <strong>CÓDIGO DISPONÍVEL</strong>
        <span class="codigo">${codigo}</span>
        Este código ainda pode ser utilizado para votar.
        `;

}


/* =========================
VOLTAR
========================= */

function voltar(){

    window.location.href=
        "index.html";

}

</script>

</body>
</html>
